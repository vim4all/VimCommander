name: Tests

# Every push to main and every pull request: the tests on Linux with each supported
# Python, and the package built, installed with pipx and started.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt's system libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install packages
        run: pip install -r requirements.txt pyftpdlib
      - name: Git identity for the tests' repositories
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Test
        run: |
          python -c "import PySide6; print('PySide6', PySide6.__version__)"
          python -m unittest discover -s tests

  package:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt's system libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Install with pipx and start it
        run: |
          pipx install dist/*.whl
          export VIMCOMMANDER_CONFIG="$RUNNER_TEMP/config.json"
          set +e
          timeout 15 vimcommander "$RUNNER_TEMP" "$RUNNER_TEMP" > start.log 2>&1
          code=$?
          cat start.log
          # 124: still running when the timeout stopped it, so it started fine
          [ "$code" -eq 124 ] && [ -f "$VIMCOMMANDER_CONFIG" ]
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
