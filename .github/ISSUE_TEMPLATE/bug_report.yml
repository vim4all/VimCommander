name: Bug report
description: Something crashes or does the wrong thing
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact keys or commands, starting from a fresh window if you can.
      placeholder: |
        1. Open a folder with a few .txt files
        2. Press `v`, `3j`, then `F5`
        3. ...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run VimCommander?
      options:
        - Windows exe from a release
        - From source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release (e.g. v0.4.0), or the commit if you run from source (`git log -1 --oneline`).
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 22.04, macOS 15, WSL2 (Ubuntu 24.04)...
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and PySide6 versions (from source only)
      description: "`python --version` and `python -c \"import PySide6; print(PySide6.__version__)\"`"
  - type: textarea
    id: logs
    attributes:
      label: Error output or messages
      description: A traceback from the terminal, the crash dialog's text, or the output of `:messages`.
      render: text
